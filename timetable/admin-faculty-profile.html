<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher Profile — Timetable &amp; Classroom Allocation</title>
<link rel="stylesheet" href="css/style.css?v=5" />
<style>
.tp-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tp-avatar{width:64px;height:64px;border-radius:50%;background:#1b2a52;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.tp-stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.tp-stat{background:#f4f6fb;border-radius:10px;padding:10px 14px;min-width:130px}
.tp-stat b{display:block;font-size:22px}
.tp-bar{height:10px;background:#e5e8f0;border-radius:6px;overflow:hidden;margin-top:6px}
.tp-bar i{display:block;height:100%;background:#1b2a52}
.tp-table{width:100%;border-collapse:collapse;font-size:13px}
.tp-table th,.tp-table td{border-bottom:1px solid #e5e8f0;padding:6px 8px;text-align:left}
.muted{color:#6b7280}.small{font-size:12px}
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h2>Teacher Profile</h2>
        
      </div>
      <div class="card card-pad">
        <div class="field" style="max-width:340px"><label>Teacher</label><select id="teacher"></select></div>
      </div>
      <div id="profile"></div>
    </main>
  </div>
  <script src="js/api.js?v=5"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/sidebar.js?v=5"></script>
  <script src="js/timetable-grid.js?v=6"></script>


  <script>
const user = requireRole("admin");
if (user) {
  renderSidebar(user, "fprofile");
  const $ = (s) => document.querySelector(s);
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  let slots = [], faculty = [];
  (async () => {
    [slots, faculty] = await Promise.all([Api.get("/timeslots"), Api.get("/faculty")]);
    faculty.sort((a, b) => a.name.localeCompare(b.name));
    fillSelect($("#teacher"), faculty, (f) => f.id, (f) => f.name);
    const q = new URLSearchParams(location.search).get("id");
    if (q) $("#teacher").value = q;
    load();
  })();
  $("#teacher").addEventListener("change", load);

  async function load() {
    const id = Number($("#teacher").value); if (!id) return;
    const f = faculty.find((x) => x.id === id);
    const entries = await Api.get("/timetable?facultyId=" + id);
    // Group consecutive 2-period practical (lab) entries on the same day/subject/section into 1 single unit
    const unitKey = (e) => {
      if (e.jointId && Number(e.jointId) > 0) return "JOINT:" + e.slot.day + ":" + e.jointId;
      if (e.groupId !== null && e.groupId !== undefined) return "GRP:" + e.groupId;
      return "SLOT:" + e.slot.id;
    };
    const seenUnits = new Set();
    const units = [];
    entries.forEach((e) => {
      const k = unitKey(e);
      if (!seenUnits.has(k)) { seenUnits.add(k); units.push(e); }
    });
    const periodSlots = new Set(units.map((e) => unitKey(e)));
    const hasSat = entries.some((e) => e.slot.day === "Sat");
    const weekSlots = slots.filter((s) => !s.isBreak && (s.day !== "Sat" || hasSat)).length;
    const byDay = DAYS.map((d) => ({ d, n: new Set(units.filter((e) => e.slot.day === d).map((e) => unitKey(e))).size }));
    const subj = new Map();
    const subjSeen = new Set();
    entries.forEach((e) => {
      if (!subj.has(e.subjectId)) subj.set(e.subjectId, { name: e.subject, secs: new Set(), n: 0, lab: e.isLab === true || e.isLab === 1 });
      const r = subj.get(e.subjectId);
      e.section.split(" + ").forEach((s) => r.secs.add(s));
      const sk = e.subjectId + ":" + unitKey(e);
      if (!subjSeen.has(sk)) { subjSeen.add(sk); r.n++; }
    });
    const sections = new Set(); entries.forEach((e) => e.section.split(" + ").forEach((s) => sections.add(s)));
    const busiest = byDay.slice().sort((a, b) => b.n - a.n)[0];
    const periods = periodSlots.size;
    const initials = f.name.replace(/^(Dr|Mr|Ms|Mrs|Prof)[.]?[ ]*/i, "").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
    $("#profile").innerHTML =
      '<div class="card card-pad" style="margin-top:16px"><div class="tp-head"><div class="tp-avatar">' + esc(initials) + '</div><div><h3 style="margin:0">' + esc(f.name) + '</h3>' +
      '<div class="muted small">Teaching staff · ' + sections.size + " section(s) · " + subj.size + " subject(s)</div></div></div>" +
      '<div class="tp-stats">' +
      '<div class="tp-stat"><b>' + periods + '</b>periods / week<div class="tp-bar"><i style="width:' + Math.min(100, Math.round((periods / Math.max(1, weekSlots)) * 100)) + '%"></i></div><span class="muted small">of ' + weekSlots + " teaching periods</span></div>" +
      '<div class="tp-stat"><b>' + Math.max(0, weekSlots - periods) + "</b>free periods</div>" +
      '<div class="tp-stat"><b>' + sections.size + "</b>sections</div>" +
      '<div class="tp-stat"><b>' + (busiest && busiest.n ? busiest.d + " (" + busiest.n + ")" : "-") + "</b>busiest day</div></div>" +
      '<p class="muted small">A class taught to several sections together (a joint class) counts as one period.</p></div>' +
      '<div class="card card-pad" style="margin-top:16px"><h3 style="margin-top:0">Subjects taught</h3>' +
      (subj.size ? '<table class="tp-table"><thead><tr><th>Subject</th><th>Type</th><th>Sections</th><th>Periods / week</th></tr></thead><tbody>' +
        Array.from(subj.values()).sort((a, b) => a.name.localeCompare(b.name)).map((r) => "<tr><td>" + esc(r.name) + "</td><td>" + (r.lab ? "Practical" : "Lecture") + "</td><td>" + Array.from(r.secs).map(esc).join(", ") + "</td><td>" + r.n + "</td></tr>").join("") + "</tbody></table>"
        : '<p class="muted">No classes placed yet. Generate a timetable first.</p>') + "</div>" +
      '<div class="card card-pad" style="margin-top:16px"><h3 style="margin-top:0">Weekly timetable</h3><div id="tpGrid"></div></div>';
   if (entries.length) renderTimetableGrid($("#tpGrid"), slots, entries, { showSection: true });
  }
}
  </script>
</body>
</html>
