<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notice Board — Timetable & Classroom Allocation</title>
<link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h2>Notice Board</h2>
        <p>Announcements and automatic updates about timetable changes, substitutions and exams.</p>
      </div>

      <div class="toolbar"><button class="btn-primary btn-sm" data-f="all">All</button><button class="btn-ghost btn-sm" data-f="announcement">Announcements</button><button class="btn-ghost btn-sm" data-f="change">Timetable changes</button></div>
      <div id="list"></div>

    </main>
  </div>
  <script src="js/api.js?v=5"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/sidebar.js?v=5"></script>
  <script>
const user = requireRole("any");
if (user) {
  renderSidebar(user, "notices");
  let all = [], filter = "all";
  function draw() {
    const rows = all.filter((n) => filter === "all" || n.kind === filter);
    $("#list").innerHTML = rows.length ? rows.map((n) => '<div class="notice ' + n.kind + '"><div class="notice-head"><span class="notice-title">' + esc(n.title) + "</span>" +
      '<span class="badge ' + (n.kind === "change" ? "badge-info" : "badge-warn") + '">' + (n.kind === "change" ? "Timetable change" : "Announcement") + "</span></div>" +
      '<div class="notice-body">' + esc(n.body) + '</div><div class="notice-foot">' + esc(n.createdBy) + " &middot; " + fmtDateTime(n.createdAt) + "</div></div>").join("") : '<div class="empty">Nothing here.</div>';
    $$(".toolbar button").forEach((b) => { b.className = (b.dataset.f === filter ? "btn-primary" : "btn-ghost") + " btn-sm"; });
  }
  $$(".toolbar button").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; draw(); }));
  Api.get("/notices?limit=100").then((r) => { all = r; draw(); }).catch((e) => toast(e.message, "err"));
}
  </script>
</body>
</html>
