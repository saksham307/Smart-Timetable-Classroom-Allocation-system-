<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Courses — Timetable & Classroom Allocation</title>
<link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h2>Courses</h2>
        <p>The programmes your university runs. Each course has sections and subjects for every year of study.</p>
      </div>

      <div class="banner info">Timetables, subjects and exams are enabled for <b>Year 2</b> and <b>Year 3</b> right now. A course itself can run for up to 6 years.</div>
      <div class="card" id="box"></div>

    </main>
  </div>
  <script src="js/api.js?v=5"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/sidebar.js?v=5"></script>
  <script src="js/crud-table.js?v=5"></script>
  <script>
const user = requireRole("admin");
if (user) {
  renderSidebar(user, "courses");
  CrudTable({
    container: $("#box"), resource: "/courses",
    columns: [{ label: "Course", render: (r) => "<b>" + esc(r.name) + "</b>" },
              { label: "Duration", render: (r) => r.durationYears + " years" }],
    fields: [{ key: "name", label: "Course name", type: "text", placeholder: "e.g. B.Tech CSE" },
             { key: "durationYears", label: "Duration (years)", type: "number", min: 1, max: 6, default: 4 }],
    removeLabel: (r) => r.name,
  });
}
  </script>
</body>
</html>
