<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generate Timetable — Timetable & Classroom Allocation</title>
<link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h2>Generate Timetable</h2>
        <p>Choose a course and semester, then generate one section or every section at once. Practicals are placed first, breaks stay free, and no room, teacher or section is ever double-booked.</p>
      </div>

      <div class="card toolbar-card">
        <div class="field"><label>Course</label><select id="course"></select></div>
        <div class="field"><label>Semester</label><select id="semester"></select></div>
        <div class="field"><label>Section</label><select id="section"></select></div>
        <button class="btn-accent" id="genOne">Generate this section</button>
        <button class="btn-primary" id="genAll">Generate all sections of this semester</button>
        <button class="btn-ghost" id="viewToggle" type="button">Show: all sections</button>
      </div>
      <div id="result" style="margin-top:18px"></div>
      <div class="card card-pad" style="margin-top:18px">
        <div id="legend"></div>
        <div id="grid"></div>
        <div id="allGrid"></div>
        <div class="muted small" style="margin-top:10px">Hover a class and press &times; to remove it (a practical removes both of its periods).</div>
      </div>

    </main>
  </div>
  <script src="js/api.js?v=5"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/sidebar.js?v=5"></script>
  <script src="js/timetable-grid.js?v=6"></script>
  <script>
const user = requireRole("admin");
if (user) {
  renderSidebar(user, "timetable");
  let courses = [], sections = [], slots = [];
  const courseSel = $("#course"), semSel = $("#semester"), secSel = $("#section");
  $("#legend").innerHTML = gridLegend();

  const current = () => sections.filter((s) => String(s.courseId) === courseSel.value && String(s.semester) === semSel.value);

  // semesters that have sections for the chosen course
  function onCourse() {
    const sems = Array.from(new Set(sections.filter((s) => String(s.courseId) === courseSel.value && s.semester != null).map((s) => s.semester))).sort((a, b) => a - b);
    const keep = semSel.value;
    semSel.innerHTML = sems.length ? sems.map((n) => '<option value="' + n + '">Semester ' + n + "</option>").join("") : '<option value="">No sections yet</option>';
    if (sems.map(String).includes(keep)) semSel.value = keep;
    else if (sems.includes(5)) semSel.value = "5";
    onFilter();
  }

  function onFilter() {
    const list = current();
    fillSelect(secSel, list, (s) => s.id, (s) => s.name + " (" + s.strength + " students)", list.length ? null : "No sections yet");
    loadGrid();
  }

  let gseq = 0, viewAll = false;

  function setView(all) {
    viewAll = all;
    $("#grid").style.display = all ? "none" : "";
    $("#allGrid").style.display = all ? "" : "none";
    $("#viewToggle").textContent = all ? "Show: one section" : "Show: all sections";
    loadGrid();
  }

  // every section of the chosen course & year, one block each (like the college timetable sheet)
  async function loadAll() {
    const list = current();
    const box = $("#allGrid");
    if (!list.length) { box.innerHTML = '<div class="empty">No sections for this course and semester yet.</div>'; return; }
    const my = ++gseq;
    const ids = new Set(list.map((x) => x.id));
    const entries = (await Api.get("/timetable?courseId=" + courseSel.value)).filter((e) => ids.has(e.sectionId));
    if (my !== gseq) return;
    const bySec = new Map();
    entries.forEach((e) => { if (!bySec.has(e.sectionId)) bySec.set(e.sectionId, []); bySec.get(e.sectionId).push(e); });
    box.innerHTML = list.map((sec) =>
      '<section class="tt-section" style="margin:0 0 34px">' +
      '<h3 style="margin:0 0 4px">Time Table &mdash; Section ' + esc(sec.name) + '</h3>' +
      '<div class="muted small" style="margin-bottom:10px">' + esc(sec.strength) + ' students</div>' +
      '<div id="sg-' + sec.id + '"></div><div id="sf-' + sec.id + '"></div></section>').join("");
    list.forEach((sec) => {
      const es = bySec.get(sec.id) || [];
      const g = $("#sg-" + sec.id), f = $("#sf-" + sec.id);
      if (!es.length) { g.innerHTML = '<div class="empty">No timetable yet for this section.</div>'; return; }
      renderTimetableGrid(g, slots, es, {
        onRemove: async (id) => {
          if (!confirm("Remove this class?")) return;
          try { await Api.del("/timetable/entry/" + id); toast("Class removed.", "ok"); loadGrid(); } catch (e) { toast(e.message, "err"); }
        },
      });
      // subject / faculty / rooms table for this section
      const subj = new Map();
      es.forEach((e) => {
        if (!subj.has(e.subjectId)) subj.set(e.subjectId, { name: e.subject, fac: e.faculty, rooms: new Set(), n: 0, lab: e.isLab === true || e.isLab === 1 });
        const r = subj.get(e.subjectId); r.n++; r.rooms.add(e.room);
      });
      f.innerHTML = '<table class="data-table" style="margin-top:12px"><thead><tr><th>Subject</th><th>Faculty</th><th>Periods / week</th><th>Room(s)</th></tr></thead><tbody>' +
        Array.from(subj.values()).sort((a, b) => a.lab - b.lab || a.name.localeCompare(b.name)).map((r) =>
          "<tr><td>" + esc(r.name) + (r.lab ? " (Lab)" : "") + "</td><td>" + esc(r.fac) + "</td><td>" + r.n + "</td><td>" + Array.from(r.rooms).map(esc).join(", ") + "</td></tr>").join("") +
        "</tbody></table>";
    });
  }

  async function loadGrid() {
    if (viewAll) return loadAll();
    if (!secSel.value) { $("#grid").innerHTML = '<div class="empty">No sections for this course and semester yet. Add one under <a href="admin-sections.html">Sections</a>.</div>'; return; }
    const my = ++gseq;
    const entries = await Api.get("/timetable?sectionId=" + secSel.value);
    if (my !== gseq) return;
    if (!entries.length) { $("#grid").innerHTML = '<div class="empty">This section has no timetable yet. Press “Generate this section”.</div>'; return; }
    renderTimetableGrid($("#grid"), slots, entries, {
      onRemove: async (id) => {
        if (!confirm("Remove this class?")) return;
        try { await Api.del("/timetable/entry/" + id); toast("Class removed.", "ok"); loadGrid(); } catch (e) { toast(e.message, "err"); }
      },
    });
  }

  function showResult(res) {
    const complete = res.failed.length === 0;
    let h = '<div class="banner ' + (complete ? "ok" : "warn") + '"><b>' + (complete ? "Timetable generated." : "Timetable generated with gaps.") + "</b> " +
      res.placed + " of " + res.required + " periods placed in " + res.millis + " ms across " + res.sections.length + " section(s).";
    if (res.bankersPrecheck && !res.bankersPrecheck.safe)
      h += "<br><b>Capacity warning:</b> " + res.bankersPrecheck.shortages.map(esc).join("; ") + ".";
    if (!complete) h += "<br>Could not place: " + res.failed.map(esc).join(" &middot; ");
    h += "</div>";
    $("#result").innerHTML = h;
  }

  async function generate(body, btn) {
    btn.disabled = true;
    try { showResult(await Api.post("/timetable/generate", body)); toast("Timetable generated.", "ok"); await loadGrid(); }
    catch (e) { $("#result").innerHTML = '<div class="banner err">' + esc(e.message) + "</div>"; }
    finally { btn.disabled = false; }
  }

  $("#genOne").addEventListener("click", () => { if (!secSel.value) return toast("Choose a section first.", "err"); viewAll = false; setView(false); generate({ sectionId: Number(secSel.value) }, $("#genOne")); });
  $("#genAll").addEventListener("click", () => {
    if (!current().length) return toast("There are no sections for this course and semester.", "err");
    setView(true);
    generate({ sectionIds: current().map((x) => x.id) }, $("#genAll"));
  });
  courseSel.addEventListener("change", onCourse);
  semSel.addEventListener("change", onFilter);
  secSel.addEventListener("change", () => { if (viewAll) setView(false); else loadGrid(); });
  $("#viewToggle").addEventListener("click", () => setView(!viewAll));

  (async () => {
    [courses, sections, slots] = await Promise.all([Api.get("/courses"), Api.get("/sections"), Api.get("/timeslots")]);
    fillSelect(courseSel, courses, (c) => c.id, (c) => c.name);
    setView(false);
    onCourse();
  })().catch((e) => toast(e.message, "err"));
}
  </script>
</body>
</html>
