<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Free Classrooms — Timetable & Classroom Allocation</title>
<link rel="stylesheet" href="css/style.css?v=5" />
<style>
.fr-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fr-wrap{overflow-x:auto;margin-top:14px}
.fr-table{border-collapse:collapse;font-size:12px;min-width:100%}
.fr-table th,.fr-table td{border:1px solid #e5e8f0;padding:5px 7px;text-align:center;white-space:nowrap}
.fr-table th{background:#1b2a52;color:#fff;font-weight:600}
.fr-table td.rn{text-align:left;font-weight:600;background:#f4f6fb;position:sticky;left:0}
.fr-free{background:#e6f6ec;color:#1b6b3a}.fr-busy{background:#fdeceb;color:#8a2c25}
.fr-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fr-chip{background:#e6f6ec;color:#1b6b3a;border-radius:999px;padding:5px 12px;font-size:13px}
.muted{color:#6b7280}.small{font-size:12px}
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h2>Free Classrooms</h2>
        <p>Find an empty classroom or lab for any day and period, so an extra class or a make-up lecture can be placed without a clash.</p>
      </div>
      <div class="card card-pad">
        <div class="fr-bar">
          <div class="field"><label>Day</label><select id="day"></select></div>
          <div class="field"><label>Period</label><select id="period"></select></div>
          <div class="field"><label>Room type</label><select id="type"><option value="">All</option><option>Lecture</option><option>Lab</option></select></div>
          <div class="field"><label>Seats at least</label><input id="cap" type="number" min="0" value="0" style="width:90px" /></div>
        </div>
        <h3 id="freeTitle" style="margin-bottom:0"></h3>
        <div class="fr-chips" id="chips"></div>
      </div>
      <div class="card card-pad" style="margin-top:16px">
        <h3 style="margin-top:0">All rooms on <span id="dayName"></span></h3>
        <p class="muted small">Green = empty classroom, red = booked (section and subject shown). A joint class is shown once for the room.</p>
        <div class="fr-wrap" id="grid"></div>
      </div>
    </main>
  </div>
  <script src="js/api.js?v=5"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/sidebar.js?v=5"></script>


  <script>
const user = requireRole("admin");
if (user) {
  renderSidebar(user, "freerooms");
  const $ = (s) => document.querySelector(s);
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  let slots = [], rooms = [], entries = [];
  (async () => {
    [slots, rooms, entries] = await Promise.all([Api.get("/timeslots"), Api.get("/rooms"), Api.get("/timetable")]);
    const days = DAYS.filter((d) => slots.some((s) => s.day === d));
    $("#day").innerHTML = days.map((d) => "<option>" + d + "</option>").join("");
    const jsDay = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date().getDay()];
    if (days.includes(jsDay)) $("#day").value = jsDay;
    fillPeriods(); draw();
  })();
  const teaching = (day) => slots.filter((s) => s.day === day && !s.isBreak);
  function fillPeriods() { $("#period").innerHTML = teaching($("#day").value).map((s) => '<option value="' + s.id + '">' + s.time + "</option>").join(""); }
  $("#day").addEventListener("change", () => { fillPeriods(); draw(); });
  ["#period", "#type", "#cap"].forEach((s) => $(s).addEventListener("input", draw));

  function bookings(slotId) {                     // roomId -> text for that period
    const m = new Map();
    entries.filter((e) => e.slot && e.slot.id === slotId).forEach((e) => {
      const t = e.section + " · " + e.subject;
      if (!m.has(e.roomId)) m.set(e.roomId, { sections: [e.section], subject: e.subject });
      else if (e.jointId) m.get(e.roomId).sections.push(e.section);
    });
    return m;
  }
  function draw() {
    const day = $("#day").value, type = $("#type").value, cap = Number($("#cap").value) || 0;
    $("#dayName").textContent = day;
    const list = rooms.filter((r) => (!type || r.type === type) && r.capacity >= cap).sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name, undefined, { numeric: true }));
    const slot = Number($("#period").value), b = bookings(slot);
    const free = list.filter((r) => !b.has(r.id));
    const ps = slots.find((s) => s.id === slot);
    $("#freeTitle").textContent = ps ? free.length + " of " + list.length + " rooms are empty on " + day + " " + ps.time : "";
    $("#chips").innerHTML = free.map((r) => '<span class="fr-chip">' + esc(r.name) + " · " + r.capacity + " seats</span>").join("") || '<span class="muted">No empty room for this filter.</span>';
    const per = teaching(day), maps = per.map((s) => bookings(s.id));
    $("#grid").innerHTML = '<table class="fr-table"><thead><tr><th>Room</th>' + per.map((s) => "<th>" + s.time + "</th>").join("") + "</tr></thead><tbody>" +
      list.map((r) => '<tr><td class="rn">' + esc(r.name) + ' <span class="muted small">(' + r.capacity + ")</span></td>" +
        maps.map((m) => { const x = m.get(r.id); return x ? '<td class="fr-busy" title="' + esc(x.subject) + '">' + esc(x.sections.join(" + ")) + "</td>" : '<td class="fr-free">Free</td>'; }).join("") + "</tr>").join("") +
      "</tbody></table>";
  }
}
  </script>
</body>
</html>
